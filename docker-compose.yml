# Usage:
#   With local MongoDB:  docker-compose --profile local-db up
#   With external MongoDB: set MONGODB_URI in .env, then: docker-compose up

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/agent-factory}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-in-production-32bytes}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - AGENT_MAX_SNAPSHOTS=${AGENT_MAX_SNAPSHOTS:-50}
      - ENGINE_DEFAULT_PARALLEL_NODES=${ENGINE_DEFAULT_PARALLEL_NODES:-2}
      - LLM_CLIENT_TOOL_TIMEOUT_MS=${LLM_CLIENT_TOOL_TIMEOUT_MS:-60000}
      - WEBHOOK_PUBLIC_BASE_URL=${WEBHOOK_PUBLIC_BASE_URL:-http://localhost:3000}
      - WEBHOOK_MAX_BODY_BYTES=${WEBHOOK_MAX_BODY_BYTES:-1048576}
      - WEBHOOK_RATE_LIMIT_PER_MINUTE=${WEBHOOK_RATE_LIMIT_PER_MINUTE:-60}
      - WEBHOOK_HANDLER_TIMEOUT_MS=${WEBHOOK_HANDLER_TIMEOUT_MS:-1000}
      - WEBHOOK_HANDLER_MEMORY_MB=${WEBHOOK_HANDLER_MEMORY_MB:-32}
      - WEBHOOK_RUN_WAIT_TIMEOUT_MS=${WEBHOOK_RUN_WAIT_TIMEOUT_MS:-30000}
    restart: unless-stopped

  # Optional: only starts with --profile local-db
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    profiles:
      - local-db

volumes:
  mongo_data:
